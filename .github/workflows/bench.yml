# G0 score-quality benchmark (tests/bench/README.md).
# The gate is the regression gate on every push/PR. Its steps run as five parallel shard jobs (shard-a .. shard-e), and the job named
# `gate` passes only when every shard passed (TD22). The nightly jobs (full suite, gate sensitivity, the independent review's
# adversarial checks) run on a schedule or by hand.
# No npm install: the benchmark needs only Node, the Python standard library and git. The two checks
# that drive the real page - tests/scoregraph/tools/shadow-legacy.js --check and app-import-check.js
# (G02 §14) - need puppeteer and `npm start`, so they run locally, like T1-C conformance.
name: bench
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

# A new push to a pull request cancels that PR's older run (its result is for a commit nobody will merge). A push to main, the
# schedule and a manual dispatch each get a group of their own (the run id), so none of them is ever cancelled, or replaced by a
# newer pending run of the same group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}-{2}', github.workflow, github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE GATE, SHARDED (TD22). The 59 steps that used to be one job of 26-50 minutes run as five jobs at once (hosted runners are free
  # for a public repository). The wall-clock is the slowest of the five: about 11 minutes (4 runs on 2026-10-06: 10.6-11.1), and
  # 6-7 when every shard lands on a fast runner; the same code took 26-50 minutes as one job. Rules for keeping it right:
  #  - every step of the old job is in exactly one shard, in its old relative order, with its command unchanged;
  #  - steps that depend on each other stay together: `run --suite X` then `check --suite X` (check reads what run wrote under
  #    tests/bench/out/X), `hands_data.py && train_hands.js --check` and `key_data.py && key-eval.js --check` (the data goes
  #    to tests/bench/.cache). Every other step reads committed files and writes only under a path of its own or a temp dir;
  #  - the verdict is the job named exactly `gate`, the last of these jobs: green only if every shard is green. The shards are
  #    deliberately not named gate-*, so nothing that looks for "gate" can take one of them for the verdict;
  #  - a new step goes in the shard with the most slack. Step seconds per shard, mean of the fast and of the slow runs of
  #    2026-10-05/06 (a job adds about 15 s of checkout and setup): a 336/592, b 340/587, c 334/575, d 333/585, e 323/548;
  #    rec-core alone is 336/592, so no split can beat that unless that suite is sharded;
  #  - every job that runs the ScoreGraph tests (and layout-hashes.js) needs the whole history: fetch-depth 0.

  # shard-a: rec-core
  #   (steps ~336 s on a fast runner, ~592 s on a slow one)
  shard-a:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                 # the ScoreGraph tests compare package.json with the G1 base commit
      - uses: actions/setup-node@v4
        with: { node-version: '24' }          # same major as the recorded baseline
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python tests/bench/run.py run --suite rec-core
      - run: python tests/bench/run.py check --suite rec-core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-shard-a
          path: |
            tests/bench/out/rec-core/summary.md

  # shard-b: rec-grid, rec-arrange-smoke, robust, the engrave generator checks, test:rec, the key check
  #   (steps ~340 s on a fast runner, ~587 s on a slow one)
  shard-b:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                 # the ScoreGraph tests compare package.json with the G1 base commit
      - uses: actions/setup-node@v4
        with: { node-version: '24' }          # same major as the recorded baseline
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: npm run test:rec                         # G10a-1: rec/ S0-S2 (attacks, pulse tracks, the metre model) and toMusicXml recording 'v2'
      - run: python tests/bench/tools/key_data.py && node rec/tools/key-eval.js --check   # G10a-3 (S8): the key stage's committed evaluation on the catalogue truth is what the code makes (G10 section 22)
      - run: node tests/engrave/tools/make-e-fixtures.js --check   # the E fixtures are the generator's (G04 §22.1)
      - run: node tests/engrave/tools/make-corpus.js --check       # the R corpus manifest is the rule's (G04 §22.2)
      - run: node tests/engrave/tools/make-metrics.js --check      # G4b: the layout's glyph metrics are the pinned font's (G04 §18.2)
      - run: node tests/engrave/tools/make-outlines.js --check     # G4c: the SVG backend's glyph outlines are the pinned font's (G04 §18.2)
      - run: node tests/engrave/tools/make-text-metrics.js --check   # G4d-1a: the text-width table's form and digest (G04 §18.3) - no network; the rebuild runs nightly
      - run: node tests/engrave/tools/layout-hashes.js             # G4b: the committed layout hashes, on Linux too (A27)
      - run: node tests/engrave/tools/bench.js check --suite r     # L1 on the reference corpus against its baseline (G04 §21.5)
      - run: node tests/engrave/tools/bench.js check --suite e
      - run: node tests/engrave/tools/bench.js check --suite x
      - run: python tests/bench/run.py run --suite robust
      - run: python tests/bench/run.py check --suite robust
      - run: python tests/bench/run.py run --suite rec-arrange-smoke   # G10c-0: what the one-note arranger does to recordings, against the true score
      - run: python tests/bench/run.py check --suite rec-arrange-smoke
      - run: python tests/bench/run.py run --suite rec-grid        # G10a-2: v2 with and without its grid stage (rec/grid.js), oracle beats and swing included
      - run: python tests/bench/run.py check --suite rec-grid
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-shard-b
          path: |
            tests/bench/out/robust/summary.md
            tests/bench/out/rec-arrange-smoke/summary.md
            tests/bench/out/rec-grid/summary.md

  # shard-c: test:scoregraph, test:difficulty, the rec trainer check, core, core-app, smoke-app, rec-smoke
  #   (steps ~334 s on a fast runner, ~575 s on a slow one)
  shard-c:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                 # the ScoreGraph tests compare package.json with the G1 base commit
      - uses: actions/setup-node@v4
        with: { node-version: '24' }          # same major as the recorded baseline
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: npm run test:scoregraph                 # the ScoreGraph library and the graphs toMusicXml writes from (G01)
      - run: npm run test:difficulty                 # G6a: difficulty features, the ranker, metamorphic tests, the dataset/weights reproduce (G06)
      - run: node difficulty/tools/train.js --check  # G6a: the committed leave-one-book-out and hold-out evaluation reproduces (G06 §11)
      - run: node rec/tools/train.js --check          # G10a-1 (AI-5a): the committed weights and evaluation are what the training makes (G10 section 18)
      - run: python tests/bench/run.py run --suite core
      - run: python tests/bench/run.py check --suite core
      - run: python tests/bench/run.py run --suite smoke-app      # the app's options (closeGaps, exactBars): what users get (G10a-0)
      - run: python tests/bench/run.py check --suite smoke-app
      - run: python tests/bench/run.py run --suite core-app
      - run: python tests/bench/run.py check --suite core-app
      - run: python tests/bench/run.py run --suite rec-smoke       # G10a-0: the recording metrics on the calibrated humanizer
      - run: python tests/bench/run.py check --suite rec-smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-shard-c
          path: |
            tests/bench/out/core/summary.md
            tests/bench/out/core/results.json
            tests/bench/out/core/run.json
            tests/bench/out/core-app/summary.md

  # shard-d: the unit tests, realize, songgraph, playability, the hands and rests checks, golden/lint/correctness, smoke, the replays, transcription-core
  #   (steps ~333 s on a fast runner, ~585 s on a slow one)
  shard-d:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                 # the ScoreGraph tests compare package.json with the G1 base commit
      - uses: actions/setup-node@v4
        with: { node-version: '24' }          # same major as the recorded baseline
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m unittest discover -s tests/bench/unit -t tests/bench
      - run: npm run test:playability                # G5a: the playability analyzer, its mutation suite, R-corpus false positives, the legacy-arranger baseline (G05)
      - run: npm run test:songgraph                  # G7a: key regions, harmony, melody/bass, sections/phrases, voice roles, energy, span round trips, mutation suite (G07)
      - run: npm run test:realize                     # G8a: the deterministic realizer, golden determinism, mutation suite (G08)
      - run: python tests/bench/tools/hands_data.py && node tests/bench/tools/train_hands.js --check   # G10a-2 (AI-5b, S4): the hand model and its evaluation are what the training makes (G10 section 19)
      - run: node tests/bench/tools/train_rests.js --check  # G10a-3 (AI-5b, S6): the silence classifier's weights and evaluation are what the training makes (G10 section 22; ~30-60 s)
      - run: node tests/scoregraph/tools/make-midi-fixtures.js --check   # the committed MIDI bytes are the generator's (G02)
      - run: python tests/bench/run.py golden
      - run: python tests/bench/run.py lint-corpus
      - run: python tests/bench/tools/make_provenance.py --check
      - run: python tests/bench/run.py correctness
      - run: python tests/bench/run.py run --suite smoke
      - run: python tests/bench/run.py check --suite smoke
      - run: python tests/bench/run.py run --suite replay-public   # exits with the replay verdict
      - run: python tests/bench/run.py run --suite replay-of       # G10a-0: the production browser model (Onsets & Frames) on rendered audio, replayed from committed notes
      - run: python tests/bench/run.py run --suite replay-of-app   # the same fixtures with the app's options
      - run: python tests/bench/run.py run --suite replay-of-v2    # G10a-1: and with the recording conversion v2
      - run: python tests/bench/run.py run --suite replay-public-v2   # G10a-3 (S9): the helper's real pedal on rendered audio (no pedal was played), with the pedal policy
      - run: npm run test:transcription-core && npm run test:arranger
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-shard-d
          path: |
            tests/bench/out/replay-public/summary.md
            tests/bench/out/correctness/report.json

  # shard-e: test:engrave, test:home-worker, the planner, the grid check, sg-roundtrip, robust-app, rec-robust
  #   (steps ~323 s on a fast runner, ~548 s on a slow one)
  shard-e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                 # the ScoreGraph tests compare package.json with the G1 base commit
      - uses: actions/setup-node@v4
        with: { node-version: '24' }          # same major as the recorded baseline
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: npm run test:home-worker                # G10b-1: the home-PC queue, its worker and server.js with it (Node only, ~40 s; the Postgres part skips without PPP_TEST_PG_URL)
      - run: npm run test:engrave                    # G4a-G4d-1a: render source, NotationPlan and ledger, layout, notation, SVG, curves and marks (G04)
      - run: npm run test:arrangement-planner         # G7b: texture ladder, deterministic search, real-corpus coverage, mutation suite (G07B); one test file at a time (--test-concurrency=1), so its 200 ms plan() budget is measured beside no other file (tests/timing.js)
      - run: node tests/bench/tools/train_grid.js --check   # G10a-2 (AI-5b): the grid stage's committed weights are what the training makes (G10 section 20)
      - run: python tests/bench/run.py sg-roundtrip  # every committed MusicXML through ScoreGraph and back (G01)
      - run: python tests/bench/run.py run --suite robust-app
      - run: python tests/bench/run.py check --suite robust-app
      - run: python tests/bench/tools/make_rec_suites.py --check   # the committed rec-* suites are the generator's (G10a-0)
      - run: python tests/bench/run.py run --suite rec-robust
      - run: python tests/bench/run.py check --suite rec-robust
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-shard-e
          path: |
            tests/bench/out/robust-app/summary.md
            tests/bench/out/rec-robust/summary.md

  # The verdict. The merge rule is "read the result of the check named gate": this is that check. It runs after every shard (also
  # when one failed or was cancelled, hence always()) and is green only when every shard's result is success - a failed, cancelled
  # or skipped shard turns it red. It also counts the shard jobs in this file against the ones it waited for, so a shard added
  # without a place in `needs` is red, not silently ignored. No schedule run: the shards are skipped there, the nightly jobs run.
  gate:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [shard-a, shard-b, shard-c, shard-d, shard-e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4                     # only to read this file's list of shards
      - name: every shard passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          waited=$(echo "$NEEDS" | jq 'length')
          not_success=$(echo "$NEEDS" | jq '[to_entries[] | select(.value.result != "success")] | length')
          in_file=$(grep -cE '^  shard-[a-z]+:[[:space:]]*$' .github/workflows/bench.yml)
          echo "shards waited for: $waited, shard jobs in the workflow: $in_file, not successful: $not_success"
          if [ "$waited" != "$in_file" ]; then echo "gate FAILED: a shard job is not in needs (or the reverse)"; exit 1; fi
          if [ "$not_success" != "0" ]; then echo "gate FAILED: a shard did not succeed"; exit 1; fi
          echo "gate passed: all $waited shards succeeded"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 100                 # was 45, when `full` took minutes and the job stopped at its first failing step; run to the
                                         # end it is ~42 min locally (mutation-check 11, full 7, adversarial 9, final_review 12) and
                                         # 1.1-1.5x that on a runner
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }                 # test:scoregraph compares package.json with the G1 base commit (aff7080), like the gate
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: node tests/engrave/tools/make-text-metrics.js --check --fetch --strict   # G4d-1a: the text widths rebuilt from the pinned fonts (network; fails if it cannot)
      - run: python tests/bench/run.py mutation-check
      - run: python tests/bench/run.py run --suite full
      - run: python tests/bench/run.py check --suite full
      - run: python tests/bench/review/adversarial.py     # the review's checks; exit 1 on any GAP
      - run: python tests/bench/review/final_review.py    # the final review's mutations (G00 §19-§20); exit 1 on a gap
      - run: python tests/bench/review/final_oracle.py    # correct outputs engraved differently score perfectly
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-full
          path: |
            tests/bench/out/full/summary.md
            tests/bench/out/full/run.json
            tests/bench/out/mutation/mutation-report.json
            tests/bench/out/review/adversarial-report.json
            tests/bench/out/final-review/final-review-report.json
      # G04 §21.5, §24.8 (G4f-1): the gate job's npm run test:engrave already carries the whole mutation suite
      # (M1-M25, G04 §23) and bench.js check --suite r - both stay in the gate because they measured well inside
      # A41's <= 90 s budget (G4f-1's record, docs/GOALS/G04_PROFESSIONAL_ENGRAVING.md §40). This job reconfirms the
      # full suite independently of the gate, then carries the checks that need a live page and puppeteer (A35-A37's
      # CPU 4x throttle, A38-A40's print pipeline) - the gate stays Node-only and npm-install-free by
      # design; this job is where the expensive, browser-dependent evidence lives. The two puppeteer
      # steps run continue-on-error: this was their first time in CI (previously local-only tools, G04 §21.5 marks
      # the perf tools "로컬") - a runner-specific hiccup (Chrome download, a missing system
      # font affecting text metrics) should not turn nightly red before the Lead has seen a first real run; the
      # uploaded JSON keeps the result visible either way (G4-F3). A third step, A43's legacy-vs-engrave comparison
      # (tests/engrave/tools/legacy-geometry.js), was removed with the legacy renderer (G4 #54, 4962251): its
      # continue-on-error hid "Cannot find module" on the first nightly that reached it (2026-10-03).
      - run: npm run test:engrave                          # the full mutation suite (all 25, G04 §23), reconfirmed apart from the gate
      - run: npm run test:scoregraph
      - run: npm ci                                        # puppeteer, for the two steps below only
      - name: serve this tree for the puppeteer tools
        run: |
          NODE_ENV=production HOST=127.0.0.1 PORT=8801 node server.js &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8801/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8801/ > /dev/null || { echo "the server never came up - failing this step so it is not confused with a puppeteer-tool hiccup (Lead re-check, G4f-1)"; exit 1; }
      - name: A35-A37 - page performance at CPU 1x and 4x (tests/engrave/tools/page-check.js)
        continue-on-error: true
        run: node tests/engrave/tools/page-check.js --url http://127.0.0.1:8801 --part perf,a31 --cpu 1,4 --out tests/engrave/out/page
      - name: A38-A40 - the print pipeline through a real print command (tests/engrave/tools/print-check.js)
        continue-on-error: true
        run: node tests/engrave/tools/print-check.js --url http://127.0.0.1:8801 --out tests/engrave/out/print
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-g4f
          path: |
            tests/engrave/out/page/page-check.json
            tests/engrave/out/print/print-check.json

  # The recording nightly is four jobs. rec-full (11,196 cases, G10a-0..2) used to run in one process on one runner and was
  # killed ("The runner has received a shutdown signal", 2026-10-02, 14 minutes in): the run holds every case's performance
  # and notation in memory (13.7 GB of python on the measuring machine) and then forks its stability pool of 4 workers off that
  # heap, which a 16 GB runner cannot take (docs: tests/bench/README.md, "Sharded runs"). So: the sensitivity checks and the
  # rec-arrange suites (nightly-rec: mutation-check --rec and --rec-arrange, rec-arrange-core and -full), rec-full as a matrix of N
  # shards (nightly-rec-shard), and the merge, which checks the baseline like the unsharded run did (nightly-rec-full). The shard
  # count is in two places - the matrix and --shard K/4 - and merge-shards refuses a run that is not exactly the shards it was
  # told of.
  nightly-rec:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Was 90, which one slow runner from red. Measured on a runner, by workflow_dispatch of this job at 1b30342 (2026-10-05, all
    # green, 5092 s = 84.9 minutes in all):
    #   mutation-check --rec          2719 s (2570 s on 2026-10-04 before the G10a-2b rec-mutation-play group; 1301 s on 2026-10-03,
    #                                 before the S8 key and S9 pedal groups and the later rows)
    #   mutation-check --rec-arrange   588 s
    #   rec-arrange-core               318 s
    #   rec-arrange-full               830 s
    #   rec-hands-play                 346 s
    #   rec-arrange-play               279 s       (the checks take under a second each)
    # The 2026-10-04 nightly-rec went red at its first step (a stale mutation row) and skipped everything after it, so it never
    # showed that the whole job is this long. 85 of 90 minutes is one slow runner from red; 120 leaves 35 minutes. A failing step
    # still ends the job at once, so a red run is not slower for it.
    # G10c-1a (2026-10-07) adds the row v2-lead to rec-arrange-core and -full (a third row: 50% more cases in each; a lead sheet
    # arrangement costs about what a reduction does, measured locally: core 252 cases in 174 s, 84 of them the new row) and
    # mutation-check --rec-arrange-lead (26 references, six defects and the no-op: 5 minutes locally on a loaded machine, about 3 on
    # an idle one). Estimated from the times above, not yet measured on a runner: core +160 s, full +415 s, lead mutation +180 s =
    # about 12-13 minutes, so 85 + 13 = 98 minutes, which would leave 22 of 120, less than the 35 this limit was set to keep. So the
    # limit is 135 (again 37 minutes of room; the job is not sharded: the new steps are 13% of it). Replace this estimate with the
    # first dispatch's measure.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      # G10a-0: the recording metrics' gate sensitivity (one planted defect per metric, each must be a REGRESSION that names it)
      - run: python tests/bench/run.py mutation-check --rec
      # G10c-0: the rec-arrange metrics' gate sensitivity (one planted defect per metric in the arranger) and the full suite (aggregates)
      - run: python tests/bench/run.py mutation-check --rec-arrange
      # G10c-1a: the lead sheet of a recording (rec/leadsheet.js, the arranger glue's recordingArrange, the planner's relax 3): one planted defect per decision (about 3 minutes)
      - run: python tests/bench/run.py mutation-check --rec-arrange-lead
      - run: python tests/bench/run.py run --suite rec-arrange-core    # the core's small references and the 20 real-AMT fixtures of replay-of (about 5 minutes: not in the gate, which is near its time limit)
      - run: python tests/bench/run.py check --suite rec-arrange-core
      - run: python tests/bench/run.py run --suite rec-arrange-full
      - run: python tests/bench/run.py check --suite rec-arrange-full
      # G10a-2b: S4's playability on the references as piano covers are written (texture octaves): the hands' crossing and G5a hard
      # violations (rec-hands-play, about 4-8 minutes) and the one-note arranger without the hands fallback (rec-arrange-play, about 2-4)
      - run: python tests/bench/run.py run --suite rec-hands-play
      - run: python tests/bench/run.py check --suite rec-hands-play
      - run: python tests/bench/run.py run --suite rec-arrange-play
      - run: python tests/bench/run.py check --suite rec-arrange-play
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-rec-checks
          path: |
            tests/bench/out/mutation/mutation-report.json
            tests/bench/out/mutation-v2/mutation-report.json
            tests/bench/out/mutation-play/mutation-report.json
            tests/bench/out/mutation-arrange/mutation-report.json
            tests/bench/out/mutation-arrange-lead/mutation-report.json
            tests/bench/out/rec-arrange-core/summary.md
            tests/bench/out/rec-arrange-full/summary.md
            tests/bench/out/rec-arrange-full/run.json
            tests/bench/out/rec-hands-play/summary.md
            tests/bench/out/rec-arrange-play/summary.md

  nightly-rec-shard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false                   # one shard's trouble must not hide what the others measured
      matrix:
        shard: [1, 2, 3, 4]              # keep in step with --shard K/4 below
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python tests/bench/run.py run --suite rec-full --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        with:
          name: rec-full-shard-${{ matrix.shard }}
          path: |
            tests/bench/out/rec-full/shards/${{ matrix.shard }}-of-4/shard.json
            tests/bench/out/rec-full/shards/${{ matrix.shard }}-of-4/run.json
          retention-days: 3              # an input of the merge, not a result

  nightly-rec-full:
    needs: nightly-rec-shard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/download-artifact@v4
        with:
          pattern: rec-full-shard-*
          path: tests/bench/out/rec-full/shards     # one directory per shard artifact, each holding its shard.json and run.json
      - run: python tests/bench/run.py merge-shards --suite rec-full    # the whole run's results.json and run.json; refuses anything but N shards of this commit
      - run: python tests/bench/run.py check --suite rec-full           # the hold-out aggregate and the baseline, as the unsharded run did
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-rec-full
          path: |
            tests/bench/out/rec-full/summary.md
            tests/bench/out/rec-full/run.json
