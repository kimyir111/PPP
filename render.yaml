services:
  - type: web
    name: ppp-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ppp-db
          property: connectionString

databases:
  - name: ppp-db
    plan: free
    region: singapore
    postgresMajorVersion: 16
